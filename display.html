<!doctype html>
<html lang="en" class="display-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Queueing System | Display</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="display-screen">
  <header class="app-header">
    <div class="brand">
      <h1>Now Serving</h1>
      <span>TV / Monitor Display</span>
    </div>
  </header>

  <main class="page display-page">
    <div class="display-layout">
      <section class="card display-current">
        <div class="current-number">
          <span>Currently Serving</span>
          <strong id="displayQueue">---</strong>
          <span id="displayService">Waiting for next call</span>
          <div class="meta-row">
            <span class="pill" id="displayCounter">Counter --</span>
            <span class="pill" id="displayTime">--</span>
          </div>
        </div>
      </section>

      <aside class="card display-recent">
        <h2>Recent Calls</h2>
        <div class="recent-scroll" id="recentScroll">
          <div class="list" id="recentList"></div>
        </div>
      </aside>
    </div>
  </main>

  <script src="js/api-fetch.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
