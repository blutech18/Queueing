<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queueing System | Kiosk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="kiosk-screen">
  <header class="app-header">
    <div class="brand">
      <h1>Queueing System</h1>
      <span>Kiosk / Client Screen</span>
    </div>
  </header>

  <main class="page kiosk-page">
    <section class="section-title">
      <div>
        <h2>Select Transaction</h2>
        <p>Tap the service you need to get a queue number.</p>
      </div>
      <button class="secondary" id="refreshServices">Refresh</button>
    </section>

    <section class="grid kiosk-grid" id="serviceGrid" aria-live="polite"></section>
    <p class="message" id="kioskMessage"></p>
  </main>

  <dialog class="modal" id="subServiceModal" aria-labelledby="subServiceModalTitle">
    <div class="modal-card records-modal-card">
      <h2 id="subServiceModalTitle">Choose Service</h2>
      <div class="records-options" id="subServiceOptions"></div>
      <p class="message error records-message" id="subServiceMessage" hidden></p>
      <div class="modal-actions records-modal-actions">
        <button type="button" id="subServiceProceed">Proceed</button>
        <button type="button" class="secondary" id="subServiceClear">Clear</button>
        <button type="button" class="secondary" id="subServiceCancel">Cancel</button>
      </div>
    </div>
  </dialog>

  <dialog class="modal" id="ticketModal" aria-labelledby="ticketTitle">
    <div class="modal-card">
      <h2 id="ticketTitle">Your Queue Number</h2>
      <span class="ticket-number" id="ticketNumber">---</span>
      <p id="ticketService"></p>
      <ul class="ticket-sub-services" id="ticketSubServices" hidden></ul>
      <p class="message">Please wait for your number to be called.</p>
      <div class="modal-actions">
        <button type="button" id="printTicket">Print Ticket</button>
        <button type="button" class="secondary" id="closeTicket">Close</button>
      </div>
    </div>
  </dialog>

  <script src="js/api-fetch.js"></script>
  <script src="js/service-icons.js"></script>
  <script type="module" src="js/kiosk.js"></script>
</body>
</html>
