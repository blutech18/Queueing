<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queueing System | Counter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>Counter Dashboard</h1>
      <span>Staff queue controls</span>
    </div>
  </header>

  <main class="page counter-layout">
    <section class="card">
      <div class="section-title">
        <div>
          <h2>Serving</h2>
          <p>Call, recall, skip, or complete the selected service queue.</p>
        </div>
      </div>

      <div class="current-number">
        <span>Current Queue</span>
        <strong id="currentQueue">---</strong>
        <span id="currentService">No active queue</span>
      </div>

      <div class="actions">
        <button id="nextBtn">Next</button>
        <button class="secondary" id="recallBtn">Recall</button>
        <button class="warning" id="skipBtn">Skip</button>
        <button class="success" id="doneBtn">Done</button>
      </div>
      <p class="message" id="counterMessage"></p>
    </section>

    <aside class="card">
      <h2>Counter Setup</h2>
      <div class="form-grid">
        <label>
          Counter Number
          <select id="counterNumber">
            <option value="1">Counter 1</option>
            <option value="2">Counter 2</option>
            <option value="3">Counter 3</option>
            <option value="4">Counter 4</option>
            <option value="5">Counter 5</option>
            <option value="6">Counter 6</option>
            <option value="7">Counter 7</option>
            <option value="8">Counter 8</option>
          </select>
        </label>
        <label>
          Assigned Service
          <select id="serviceSelect"></select>
        </label>
      </div>
      <div class="counter-setup-actions">
        <button type="button" id="saveSetupBtn">Save</button>
      </div>
    </aside>
  </main>

  <script src="js/api-fetch.js"></script>
  <script src="js/counter.js"></script>
</body>
</html>
